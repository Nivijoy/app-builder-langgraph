[project]
name = "app-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nivijoy", email = "nivem26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
     "groq>=0.31.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
